<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SVG">
  <title>SVG</title>
  <desc>SVG file icon: document sheet with folded corner and Chrome-like tricolor ring</desc>

  <!-- Black/transparent outer canvas -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Document sheet: rounded rectangle with cut top-right corner -->
  <path d="M 116 72
           L 344 72
           L 416 144
           L 416 424
           Q 416 440 400 440
           L 116 440
           Q 100 440 100 424
           L 100 88
           Q 100 72 116 72 Z"
        fill="#f8f8fa"/>

  <!-- Folded corner: gray triangle showing depth, with subtle crease line -->
  <path d="M 344 72 L 416 144 L 344 144 Z" fill="#d0d0d6"/>
  <path d="M 344 72 L 416 144" stroke="#a8a8b0" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Chrome-like tricolor ring (centered at 256, 220) -->
  <g transform="translate(256 220)">
    <!-- Red: top half of the ring -->
    <path d="M -88 0 A 88 88 0 0 1 88 0 L 36 0 A 36 36 0 0 0 -36 0 Z" fill="#ea4335"/>
    <!-- Green: bottom-right quadrant -->
    <path d="M 88 0 A 88 88 0 0 1 0 88 L 0 36 A 36 36 0 0 0 36 0 Z" fill="#34a853"/>
    <!-- Yellow: bottom-left quadrant -->
    <path d="M 0 88 A 88 88 0 0 1 -88 0 L -36 0 A 36 36 0 0 0 0 36 Z" fill="#fbbc05"/>
    <!-- White inner ring -->
    <circle cx="0" cy="0" r="36" fill="#ffffff"/>
    <!-- Blue center -->
    <circle cx="0" cy="0" r="22" fill="#4285f4"/>
  </g>

  <!-- SVG label: centered beneath the circle -->
  <text x="256" y="404" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700"
        fill="#6e6e78"
        letter-spacing="2">SVG</text>
</svg>