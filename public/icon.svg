<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="5" y="5" width="502" height="502" rx="107" fill="none" stroke="#2a2a40" stroke-width="6"/>
  <circle cx="256" cy="256" r="196" fill="url(#glow)"/>
  <!-- progress ring arc: 240deg neon arc, gap at bottom -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00ff88" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="628.3 942.5" stroke-dashoffset="0"
          transform="rotate(-150 256 256)"/>
  <!-- faint inner guidance arc -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#3a3a5c" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"
          transform="rotate(-150 256 256)"/>
  <!-- runner dot at arc head -->
  <circle cx="418" cy="194" r="22" fill="#66ffb2"/>
  <circle cx="418" cy="194" r="34" fill="#00ff88" opacity="0.18"/>
</svg>
